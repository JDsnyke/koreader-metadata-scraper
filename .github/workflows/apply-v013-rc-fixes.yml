name: Apply v0.1.3 RC fixes

on:
  push:
    branches:
      - agent/v0.1.3-reliability-matching
    paths:
      - .github/workflows/apply-v013-rc-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: agent/v0.1.3-reliability-matching
          fetch-depth: 0

      - name: Apply release-candidate fixes
        run: python3 scripts/apply_v013_rc_fixes.py

      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git diff --cached --check
          git commit -m "Finalize v0.1.3 transaction and batch safety"
          git push origin HEAD:agent/v0.1.3-reliability-matching
