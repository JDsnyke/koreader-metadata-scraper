name: Apply v0.1.4 navigation patch

on:
  push:
    branches:
      - agent/v0.1.4-navigation-zenpm
    paths:
      - .github/workflows/apply-v014-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.1.4-navigation-zenpm
          fetch-depth: 0
      - name: Apply v0.1.4 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(data.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              count = data.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrence(s), found {count}: {old!r}')
              p.write_text(data.replace(old, new), encoding='utf-8')
              return count

          # Version the development branch as 0.1.4.
          replace_once('lib/version.lua', 'VERSION = "0.1.3"', 'VERSION = "0.1.4"')
          replace_once('update.json', '"version": "0.1.3"', '"version": "0.1.4"')
          replace_once('manifest.json', '"version": "0.1.3"', '"version": "0.1.4"')
          replace_once('manifest.json', '"source_asset": "metadata_scraper_koreader_v0.1.3.zip"', '"source_asset": "metadata_scraper_koreader_v0.1.4.zip"')
          replace_once('tests/run.lua', 'eq(Version.VERSION, "0.1.3")', 'eq(Version.VERSION, "0.1.4")')
          replace_once('tests/run.lua', 'eq(Version.user_agent(), "KOReader-Metadata-Scraper/0.1.3")', 'eq(Version.user_agent(), "KOReader-Metadata-Scraper/0.1.4")')
          replace_once('tests/run.lua', "truthy(read_file(\"update.json\"):find('\"version\": \"0.1.3\"', 1, true), \"manifest version is not 0.1.3\")", "truthy(read_file(\"update.json\"):find('\"version\": \"0.1.4\"', 1, true), \"manifest version is not 0.1.4\")")
          replace_once('tests/run.lua', 'check("v0.1.3 safety controls remain wired in the UI", function()', 'check("v0.1.4 safety and navigation controls remain wired in the UI", function()')

          # Keep the Metadata Scraper KOReader submenu underneath child windows.
          replace_once('main.lua', '                callback = function() self:startForFile(self:getCurrentFile()) end,', '                keep_menu_open = true,\n                callback = function() self:startForFile(self:getCurrentFile()) end,')
          replace_once('main.lua', '                callback = function() self:confirmUndo(self:getCurrentFile()) end,', '                keep_menu_open = true,\n                callback = function() self:confirmUndo(self:getCurrentFile()) end,')
          replace_once('main.lua', '                callback = function() self:showLastMatchDetails(self:getCurrentFile()) end,', '                keep_menu_open = true,\n                callback = function() self:showLastMatchDetails(self:getCurrentFile()) end,')
          replace_once('main.lua', '            { text = _("Choose EPUB…"), callback = function() self:chooseEpub() end },', '            { text = _("Choose EPUB…"), keep_menu_open = true, callback = function() self:chooseEpub() end },')
          replace_once('main.lua', '            { text = _("Batch folder…"), callback = function() self:chooseBatchFolder() end, separator = true },', '            { text = _("Batch folder…"), keep_menu_open = true, callback = function() self:chooseBatchFolder() end, separator = true },')
          replace_once('main.lua', '                callback = function() self:showBatchThresholdSelector() end,', '                keep_menu_open = true,\n                callback = function() self:showBatchThresholdSelector() end,')
          replace_once('main.lua', '                    { text = _("Test provider connections…"), callback = function() self:testProviders() end },', '                    { text = _("Test provider connections…"), keep_menu_open = true, callback = function() self:testProviders() end },')
          replace_once('main.lua', '                    { text = _("Save support diagnostics…"), callback = function() self:saveSupportDiagnostics() end },', '                    { text = _("Save support diagnostics…"), keep_menu_open = true, callback = function() self:saveSupportDiagnostics() end },')
          replace_once('main.lua', '                    { text = _("Hardcover API token…"), callback = function() self:editHardcover() end },', '                    { text = _("Hardcover API token…"), keep_menu_open = true, callback = function() self:editHardcover() end },')
          replace_once('main.lua', '                    { text = _("Amazon Creators API…"), callback = function() self:editAmazon() end },', '                    { text = _("Amazon Creators API…"), keep_menu_open = true, callback = function() self:editAmazon() end },')
          replace_once('main.lua', '                    { text_func = function() return _("Amazon marketplace") .. ": " .. self.settings.amazon_marketplace end, callback = function() self:showMarketplaceSelector() end },', '                    { text_func = function() return _("Amazon marketplace") .. ": " .. self.settings.amazon_marketplace end, keep_menu_open = true, callback = function() self:showMarketplaceSelector() end },')
          replace_once('main.lua', '                    { text_func = function() return _("Amazon search index") .. ": " .. self.settings.amazon_search_index end, callback = function() self:showAmazonIndexSelector() end },', '                    { text_func = function() return _("Amazon search index") .. ": " .. self.settings.amazon_search_index end, keep_menu_open = true, callback = function() self:showAmazonIndexSelector() end },')
          replace_once('main.lua', '                    { text = _("Google Books API key…"), callback = function() self:editGoogle() end },', '                    { text = _("Google Books API key…"), keep_menu_open = true, callback = function() self:editGoogle() end },')
          replace_once('main.lua', '                text = _("Check for updates…"),\n                callback = function() self:checkForUpdates(false) end,', '                text = _("Check for updates…"),\n                keep_menu_open = true,\n                callback = function() self:checkForUpdates(false) end,')
          replace_once('main.lua', '                text = _("About"),\n                callback = function()', '                text = _("About"),\n                keep_menu_open = true,\n                callback = function()')

          # Preserve custom Metadata/Quick Settings parent dialogs underneath children.
          for old, new in [
              ('UIManager:close(dialog); self:startForFile(file)', 'self:startForFile(file)'),
              ('UIManager:close(dialog); self:confirmUndo(file)', 'self:confirmUndo(file)'),
              ('UIManager:close(dialog); self:showLastMatchDetails(file)', 'self:showLastMatchDetails(file)'),
              ('UIManager:close(dialog); self:showSourceSelector()', 'self:showSourceSelector()'),
              ('UIManager:close(dialog); self:showQuickSettings()', 'self:showQuickSettings()'),
              ('UIManager:close(dialog); self:confirmBatch(path)', 'self:confirmBatch(path)'),
              ('UIManager:close(dialog); self:showProviderDialog()', 'self:showProviderDialog()'),
              ('UIManager:close(dialog); self:testProviders()', 'self:testProviders()'),
              ('UIManager:close(dialog); self:saveSupportDiagnostics()', 'self:saveSupportDiagnostics()'),
              ('UIManager:close(dialog); self:showFieldDialog()', 'self:showFieldDialog()'),
              ('UIManager:close(dialog); self:showBatchThresholdSelector()', 'self:showBatchThresholdSelector()'),
              ('UIManager:close(dialog); self:editHardcover()', 'self:editHardcover()'),
              ('UIManager:close(dialog); self:editAmazon()', 'self:editAmazon()'),
              ('UIManager:close(dialog); self:showMarketplaceSelector()', 'self:showMarketplaceSelector()'),
              ('UIManager:close(dialog); self:showAmazonIndexSelector()', 'self:showAmazonIndexSelector()'),
              ('UIManager:close(dialog); self:editGoogle()', 'self:editGoogle()'),
              ('UIManager:close(dialog); self:checkForUpdates(false)', 'self:checkForUpdates(false)'),
          ]:
              replace_all('main.lua', old, new)

          # ZenPM source documentation: give users the exact base URL ZenPM accepts.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Installation\n'
          if marker not in text:
              raise SystemExit('README installation heading not found')
          zenpm = '''## Install with ZenPM\n\nMetadata Scraper exposes a ZenPM v1 repository manifest directly from this repository. In **ZenPM → Sources → Add repository**, paste this repository URL exactly:\n\n`https://raw.githubusercontent.com/JDsnyke/koreader-metadata-scraper/main/`\n\nZenPM will read `manifest.json` from that base URL and list **JDsnyke KOReader Plugins → Metadata Scraper**. Use the raw-content base URL above rather than the normal GitHub webpage URL; ZenPM repository sources must resolve `manifest.json` directly.\n\nAfter adding it, refresh ZenPM sources. Published Metadata Scraper releases can then be installed or updated from the package listing. See [`docs/zenpm.md`](docs/zenpm.md) for repository-format and maintenance details.\n\n'''
          if '## Install with ZenPM\n' not in text:
              text = text.replace(marker, zenpm + marker, 1)
          readme.write_text(text, encoding='utf-8')

          Path('docs/zenpm.md').write_text('''# ZenPM repository support\n\nMetadata Scraper publishes a ZenPM v1 `manifest.json` at the repository root.\n\n## Repository URL for users\n\nIn ZenPM, open **Sources → Add repository** and paste this base URL exactly:\n\n`https://raw.githubusercontent.com/JDsnyke/koreader-metadata-scraper/main/`\n\nThis is the canonical ZenPM-compatible source URL for Metadata Scraper. ZenPM appends/requests `manifest.json` from the repository base, so the normal GitHub webpage URL (`https://github.com/JDsnyke/koreader-metadata-scraper`) should not be used as the package source.\n\nAfter adding the source, refresh ZenPM. The listing should show:\n\n- Repository: **JDsnyke KOReader Plugins**\n- Application: **Metadata Scraper**\n- Description: **Fetch and safely apply EPUB metadata and covers from Hardcover, Amazon Creators API, Google Books, and Open Library without rewriting EPUB files.**\n\nThe package maps to the installed KOReader module `metadata_scraper.koplugin` through the ZenPM `plugin_module` field.\n\n## Release maintenance\n\nFor each published release, update the package `version`, `source_asset`, and `size` fields in `manifest.json` to match the GitHub release asset. Keep `size` encoded as a JSON string because ZenPM's manifest schema expects a string.\n\nRun:\n\n`python3 scripts/lint_zenpm_manifest.py`\n\nbefore merging release metadata changes.\n''', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          heading = '## [0.1.3] - Unreleased\n'
          block = '''## [0.1.4] - Unreleased\n\n### Navigation and UX\n\n- Keep the **Metadata Scraper** KOReader submenu open underneath child dialogs so closing search forms, account dialogs, diagnostics, About, update checks, file/folder pickers, and other plugin windows returns to Metadata Scraper instead of the reader/file manager.\n- Preserve the Zen/context **Metadata** action dialog and Quick Settings as parent screens while their child windows are open.\n\n### ZenPM\n\n- Document the canonical ZenPM-compatible repository source URL: `https://raw.githubusercontent.com/JDsnyke/koreader-metadata-scraper/main/`.\n- Clarify that users should add the raw-content repository base rather than the normal GitHub webpage URL so ZenPM can resolve `manifest.json`.\n\n'''
          if '## [0.1.4] - Unreleased\n' not in c:
              if heading not in c:
                  raise SystemExit('CHANGELOG 0.1.3 heading not found')
              c = c.replace(heading, block + heading, 1)
          changelog.write_text(c, encoding='utf-8')

          # Release tooling and CI move to v0.1.4.
          wf = Path('.github/workflows/lua-checks.yml')
          w = wf.read_text(encoding='utf-8').replace('v0.1.3', 'v0.1.4')
          if 'tests/navigation.lua' not in w:
              w = w.replace('          lua5.1 tests/lifecycle.lua\n', '          lua5.1 tests/lifecycle.lua\n          lua5.1 tests/navigation.lua\n')
          wf.write_text(w, encoding='utf-8')

          Path('tests/navigation.lua').write_text(r'''local passed, failed = 0, 0

local function check(name, fn)
    local ok, err = pcall(fn)
    if ok then
        io.write("PASS  " .. name .. "\n")
        passed = passed + 1
    else
        io.stderr:write("FAIL  " .. name .. "\n      " .. tostring(err) .. "\n")
        failed = failed + 1
    end
end

local function truthy(value, message)
    if not value then error(message or "expected truthy value", 2) end
end

local function read_file(path)
    local fh = assert(io.open(path, "rb"))
    local data = fh:read("*all")
    fh:close()
    return data
end

check("main KOReader plugin actions preserve the Metadata Scraper menu", function()
    local data = read_file("main.lua")
    truthy(data:find('text = _("Fetch metadata for current book")', 1, true), "current-book action missing")
    truthy(data:find('keep_menu_open = true,\n                callback = function() self:startForFile(self:getCurrentFile()) end,', 1, true), "current-book action does not keep plugin menu open")
    truthy(data:find('{ text = _("Choose EPUB…"), keep_menu_open = true', 1, true), "EPUB chooser does not keep plugin menu open")
    truthy(data:find('{ text = _("Batch folder…"), keep_menu_open = true', 1, true), "batch chooser does not keep plugin menu open")
    truthy(data:find('text = _("About"),\n                keep_menu_open = true,', 1, true), "About does not keep plugin menu open")
end)

check("context Metadata actions keep their parent dialog underneath child windows", function()
    local data = read_file("main.lua")
    truthy(not data:find('UIManager:close(dialog); self:startForFile(file)', 1, true), "book action closes its parent before search")
    truthy(not data:find('UIManager:close(dialog); self:showQuickSettings()', 1, true), "context action closes its parent before settings")
    truthy(not data:find('UIManager:close(dialog); self:editHardcover()', 1, true), "Quick Settings closes before Hardcover editor")
    truthy(not data:find('UIManager:close(dialog); self:testProviders()', 1, true), "Quick Settings closes before provider diagnostics")
end)

check("ZenPM documentation exposes a paste-ready source URL", function()
    local source = "https://raw.githubusercontent.com/JDsnyke/koreader-metadata-scraper/main/"
    truthy(read_file("README.md"):find(source, 1, true), "README missing ZenPM source URL")
    truthy(read_file("docs/zenpm.md"):find(source, 1, true), "ZenPM guide missing source URL")
end)

io.write(string.format("\n%d passed, %d failed\n", passed, failed))
if failed > 0 then os.exit(1) end
''', encoding='utf-8')

          # Re-freeze updater payload hashes after runtime/version/doc changes.
          # update.json is intentionally not self-hashed.
          PY
          python3 scripts/generate_update_manifest.py
          git diff --check
          git status --short
      - name: Commit patched branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua lib/version.lua update.json manifest.json README.md docs/zenpm.md CHANGELOG.md tests/run.lua tests/navigation.lua .github/workflows/lua-checks.yml
          git commit -m "Start v0.1.4 navigation and ZenPM UX work"
          git push origin HEAD:agent/v0.1.4-navigation-zenpm
