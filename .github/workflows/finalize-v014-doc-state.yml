name: Finalize v0.1.4 documentation state

on:
  push:
    branches:
      - agent/v0.1.4-final-doc-state
    paths:
      - ".github/workflows/finalize-v014-doc-state.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.1.4-final-doc-state
          fetch-depth: 0
      - name: Finalize release-state wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "The Pages catalog intentionally tracks only published stable releases. During v0.1.4 development it continues to advertise published v0.1.3 rather than an unreleased branch build. See [`docs/zenpm.md`](docs/zenpm.md) for the repository layout, Pages activation step, and release-maintenance process."
          new = "The static ZenPM catalog tracks only published stable releases. Its repository metadata is prepared for the v0.1.4 stable release, while GitHub Pages deployment remains disabled until Pages is enabled once at repository-admin level. See [`docs/zenpm.md`](docs/zenpm.md) for the repository layout, activation prerequisite, and release-maintenance process."
          if old not in text:
              raise SystemExit("expected README development wording not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          text = text.replace("## [0.1.3] - Unreleased", "## [0.1.3] - 2026-08-16", 1)
          text = text.replace(
              "- Keep the ZenPM public catalog pinned to the latest actually published stable release while v0.1.4 remains unreleased.",
              "- Keep the ZenPM public catalog pinned to published stable releases rather than arbitrary development branch builds.",
              1,
          )
          text = text.replace(
              "- Record the published v0.1.3 release asset URL, byte size, and GitHub-reported SHA-256 digest in the Pages repository metadata.",
              "- Record stable release asset URL, byte size, and SHA-256 digest in the ZenPM repository metadata; release finalization advances that metadata to v0.1.4.",
              1,
          )
          changelog.write_text(text, encoding="utf-8")

          testing = Path("docs/v0.1.3-testing.md")
          text = testing.read_text(encoding="utf-8")
          text = text.replace(
              "This checklist is for the unreleased `agent/v0.1.3-reliability-matching` branch. Automated Lua tests are required before merge, but KOReader UI, filesystem, network, updater, and live-provider behaviour should also be exercised on a real device before publishing the stable GitHub Release.",
              "This checklist records the real-device validation used for the v0.1.3 release line. Automated Lua tests are required before merge, but KOReader UI, filesystem, network, updater, and live-provider behaviour should also be exercised on a real device before publishing a stable GitHub Release.",
              1,
          )
          testing.write_text(text, encoding="utf-8")
          PY
          python3 scripts/generate_update_manifest.py
          python3 scripts/generate_update_manifest.py --check
          python3 scripts/lint_release.py
          python3 scripts/lint_zenpm_manifest.py
          python3 scripts/lint_zenpm_site.py
          git diff --check
      - name: Commit final documentation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v014-doc-state.yml
          git add README.md CHANGELOG.md docs/v0.1.3-testing.md update.json
          git commit -m "Finalize v0.1.4 tagged-source documentation"
          git push origin HEAD:agent/v0.1.4-final-doc-state
