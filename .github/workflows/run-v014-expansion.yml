name: Run v0.1.4 roadmap expansion

on:
  push:
    branches:
      - agent/v0.1.4-navigation-zenpm
    paths:
      - scripts/apply_v014_expansion.py
      - .github/workflows/run-v014-expansion.yml

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.1.4-navigation-zenpm
          fetch-depth: 0
      - name: Apply roadmap expansion
        run: python3 scripts/apply_v014_expansion.py
      - name: Refresh updater hashes
        run: python3 scripts/generate_update_manifest.py
      - name: Keep CI workflow unchanged in bot push
        run: git checkout -- .github/workflows/lua-checks.yml
      - name: Validate patch
        run: |
          python3 -m py_compile scripts/*.py
          git diff --check
      - name: Commit expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_v014_expansion.py
          git add lib/matcher.lua lib/settings.lua providers/googlebooks.lua main.lua tests/v014_expansion.lua docs/ROADMAP_IMPLEMENTATION_CHECKLIST.md CHANGELOG.md README.md update.json
          git commit -m "Expand v0.1.4 roadmap foundations"
          git push origin HEAD:agent/v0.1.4-navigation-zenpm
