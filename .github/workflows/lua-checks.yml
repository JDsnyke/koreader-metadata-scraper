name: Lua checks

on:
  push:
    branches:
      - main
      - "agent/**"
      - "hotfix/**"
  pull_request:

concurrency:
  group: metadata-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Static release lint
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m json.tool update.json >/dev/null
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool zenpm-repo/manifest.json >/dev/null
          python3 -m json.tool zenpm-repo/packages/metadata-scraper/versions.json >/dev/null
          python3 scripts/lint_release.py
          python3 scripts/lint_zenpm_manifest.py
          python3 scripts/lint_zenpm_site.py
          python3 scripts/generate_update_manifest.py --check

      - name: Syntax check Lua files
        run: |
          find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build release ZIP
        run: |
          python3 scripts/build_release.py
          rm -rf dist/extracted
          mkdir -p dist/extracted
          unzip -q dist/metadata_scraper_koreader_v0.1.4.zip -d dist/extracted
          test -f dist/extracted/metadata_scraper.koplugin/main.lua
          test ! -e dist/extracted/metadata_scraper.koplugin/metadata_scraper.koplugin
          find dist/extracted/metadata_scraper.koplugin -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          (cd dist && sha256sum -c metadata_scraper_koreader_v0.1.4.zip.sha256)

      - name: Run regression tests
        run: |
          lua5.1 tests/run.lua
          lua5.1 tests/hardening.lua
          lua5.1 tests/diagnostics.lua
          lua5.1 tests/diagnostics_persistence.lua
          lua5.1 tests/matcher_safety.lua
          lua5.1 tests/edition_batch.lua
          lua5.1 tests/updater_integrity.lua
          lua5.1 tests/updater_v014.lua
          lua5.1 tests/lifecycle.lua
          lua5.1 tests/navigation.lua
          lua5.1 tests/v014_roadmap.lua

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: metadata-scraper-v0.1.4-${{ github.sha }}
          path: |
            dist/metadata_scraper_koreader_v0.1.4.zip
            dist/metadata_scraper_koreader_v0.1.4.zip.sha256
          if-no-files-found: error
          retention-days: 14
