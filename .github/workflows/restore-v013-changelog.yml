name: Restore v0.1.3 changelog

on:
  push:
    branches:
      - agent/v0.1.3-reliability-matching
    paths:
      - .github/workflows/restore-v013-changelog.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: agent/v0.1.3-reliability-matching
          fetch-depth: 0

      - name: Restore changelog from final green RC
        run: git show 8971de4502e50034a4dc6f10538232fce4d233a0:CHANGELOG.md > CHANGELOG.md

      - name: Commit restored changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "Restore v0.1.3 changelog"
          git push origin HEAD:agent/v0.1.3-reliability-matching
