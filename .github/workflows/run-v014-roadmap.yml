name: Run v0.1.4 roadmap helper

on:
  push:
    branches:
      - agent/v0.1.4-navigation-zenpm
    paths:
      - scripts/apply_v014_roadmap.py
      - .github/workflows/run-v014-roadmap.yml

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.1.4-navigation-zenpm
          fetch-depth: 0
      - run: python3 scripts/apply_v014_roadmap.py
      - run: python3 scripts/generate_update_manifest.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_v014_roadmap.py
          git add main.lua update.json
          git commit -m "Integrate v0.1.4 hardening roadmap controls"
          git push origin HEAD:agent/v0.1.4-navigation-zenpm
