name: Run v0.1.4 roadmap helper

on:
  push:
    branches:
      - agent/v0.1.4-navigation-zenpm
    paths:
      - scripts/apply_v014_docs.py
      - .github/workflows/run-v014-roadmap.yml

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.1.4-navigation-zenpm
          fetch-depth: 0
      - run: python3 scripts/apply_v014_docs.py
      - run: python3 scripts/generate_update_manifest.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_v014_docs.py
          git add README.md CHANGELOG.md ROADMAP.md docs/ROADMAP_IMPLEMENTATION_CHECKLIST.md update.json
          git commit -m "Document v0.1.4 hardening and Pages repository work"
          git push origin HEAD:agent/v0.1.4-navigation-zenpm
