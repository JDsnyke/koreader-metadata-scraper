name: Deploy ZenPM repository to Pages

on:
  push:
    branches:
      - main
    paths:
      - "zenpm-repo/**"
      - ".github/workflows/zenpm-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "zenpm-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload ZenPM repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: "zenpm-repo"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
