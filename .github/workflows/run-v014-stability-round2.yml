name: Run v0.1.4 stability round two

on:
  push:
    branches:
      - agent/v0.1.4-navigation-zenpm
    paths:
      - scripts/apply_v014_stability_round2.py
      - .github/workflows/run-v014-stability-round2.yml

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.1.4-navigation-zenpm
          fetch-depth: 0
      - name: Apply stability round two
        run: python3 scripts/apply_v014_stability_round2.py
      - name: Refresh updater hashes
        run: python3 scripts/generate_update_manifest.py
      - name: Validate patch
        run: |
          python3 -m py_compile scripts/*.py
          git diff --check
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/v014_expansion.lua
      - name: Commit stability fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_v014_stability_round2.py
          git add main.lua lib/util.lua providers/googlebooks.lua providers/openlibrary.lua providers/hardcover.lua providers/amazon.lua tests/v014_expansion.lua docs/ROADMAP_IMPLEMENTATION_CHECKLIST.md CHANGELOG.md update.json
          git commit -m "Harden v0.1.4 preview lifecycle and provider cooldowns"
          git push origin HEAD:agent/v0.1.4-navigation-zenpm
