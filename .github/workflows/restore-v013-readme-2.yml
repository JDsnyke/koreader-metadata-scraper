name: Restore v0.1.3 README 2

on:
  push:
    branches:
      - agent/v0.1.3-reliability-matching
    paths:
      - .github/workflows/restore-v013-readme-2.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: agent/v0.1.3-reliability-matching
          fetch-depth: 0
      - name: Restore README from verified head
        run: git show 8e75a681d53f72842bc86916749f2c1b4973cea6:README.md > README.md
      - name: Commit restored README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "Restore v0.1.3 README after connector misroute"
          git push origin HEAD:agent/v0.1.3-reliability-matching
